name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pyflakes
        run: python -m pip install pyflakes
      - name: Static checks
        run: |
          python -m pyflakes covey bin tests scripts
          bash -n scripts/*.sh
      - name: Privacy check (generic rules)
        run: python scripts/privacy_check.py
      - name: Documentation links
        run: python scripts/check_doc_links.py
      - name: Tests
        env:
          BRIDGE_TEST_LEDGER: ${{ runner.temp }}/test-ledger.jsonl
        run: python -B scripts/test_map.py run --full --why ci
