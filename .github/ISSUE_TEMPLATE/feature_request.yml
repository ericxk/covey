name: 功能建议 / Feature request
description: 想要的新功能或改进 / An idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请**不要**贴令牌、账号、飞书 id 或聊天内容。 Do **not** paste tokens, accounts, Feishu ids or chat content.
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / The problem
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 想要的做法 / What you would like
  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代办法 / Alternatives tried
  - type: input
    id: env
    attributes:
      label: 环境（系统、Python、Harness 与版本、安装方式） / Environment
      placeholder: Ubuntu 22.04，Python 3.11，Codex 0.x，git clone
